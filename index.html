<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ada yang spesial buat kamu 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#ffd3e4; --ink2:#ffb3d1; --peach:#ff8fb8; --butter:#e8467f; --mint:#b02a68; --paper:#fffafc; --txt:#5b1a3f;
  --hand:'Caveat','Segoe Script',cursive; --sans:'DM Sans',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:linear-gradient(160deg,#ffe3ee,#ffc2da) fixed;color:var(--txt);font-family:var(--sans);line-height:1.6;overflow-x:hidden}
body.locked{height:100%;overflow:hidden}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center}

/* intro */
#intro{position:fixed;inset:0;z-index:10;background:linear-gradient(160deg,#ffe3ee,#ffc2da);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;transition:opacity .8s,visibility .8s}
#intro.gone{opacity:0;visibility:hidden}
#intro .gift{font-size:84px;animation:bob 2.2s ease-in-out infinite}
#intro h1{font-family:var(--hand);font-size:clamp(40px,10vw,64px);margin:0;font-weight:700;color:var(--butter)}
#intro p{margin:0;opacity:.8;max-width:30ch}
button{font:500 16px var(--sans);background:var(--butter);color:#fff;border:0;box-shadow:0 4px 0 var(--mint);border-radius:999px;padding:14px 32px;cursor:pointer}
button:hover{background:var(--peach)}
button:focus-visible{outline:3px solid var(--txt);outline-offset:3px}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}

/* opening words */
.words{font-family:var(--hand);font-size:clamp(32px,7vw,52px);line-height:1.25;max-width:18ch;margin:0;color:var(--txt)}
.words small{display:block;font-family:var(--sans);font-size:15px;opacity:.6;margin-top:28px}

/* memories */
.memory{gap:28px}
.polaroid{background:var(--paper);color:var(--txt);padding:14px 14px 18px;width:min(320px,82vw);border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.35);rotate:var(--tilt,-3deg);position:relative}
.photo{aspect-ratio:1/1;width:100%;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:72px;overflow:hidden;background:var(--bg,var(--peach))}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid .date{font-family:var(--hand);font-size:24px;margin-top:10px;font-weight:700}
.note{font-family:var(--hand);font-size:clamp(26px,5.5vw,34px);line-height:1.3;max-width:22ch;margin:0;color:var(--mint)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s}
.reveal.in{opacity:1;transform:none}

/* finale */
#finale{background:var(--ink2);position:relative;overflow:hidden}
#finale canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#finale>*{position:relative}
.hb{font-family:var(--hand);font-weight:700;font-size:clamp(56px,16vw,130px);line-height:.95;margin:0;color:#fff;text-shadow:0 4px 0 var(--butter)}
.hb span{display:block;color:#fff}
.who{font-family:var(--hand);font-size:clamp(34px,8vw,56px);margin:18px 0 0}
.wish{max-width:34ch;margin:20px 0 28px;opacity:.85}
.bday{width:min(200px,50vw);aspect-ratio:1/1;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.4);margin-bottom:18px}
.cake{font-size:64px;animation:bob 2.2s ease-in-out infinite}
.hint{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:14px;opacity:.5;text-align:center}

#floaty{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#floaty span{position:absolute;bottom:-60px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
main{position:relative;z-index:1}
.polaroid::before{content:"";position:absolute;top:-12px;left:50%;width:92px;height:24px;margin-left:-46px;background:rgba(255,143,184,.6);rotate:-3deg;border-radius:3px}
.sticker{position:absolute;right:-16px;bottom:-16px;font-size:44px;rotate:12deg;filter:drop-shadow(0 3px 3px rgba(91,26,63,.25))}
.deco{font-size:30px;letter-spacing:6px;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){#floaty{display:none}}
@media (prefers-reduced-motion:reduce){.reveal{transition:none;opacity:1;transform:none}#intro .gift,.bday{width:min(200px,50vw);aspect-ratio:1/1;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.4);margin-bottom:18px}
.cake{animation:none}}
</style>
</head>
<body class="locked">
<div id="floaty" aria-hidden="true"></div>

<div id="intro">
  <div class="gift">🥑🎁</div>
  <h1>Ada sesuatu buat Bebeb!!</h1>
  <p>Buka pelan-pelan ya, scroll sampai akhir plss</p>
  <button id="open">Buka</button>
</div>

<main>
  <section>
    <p class="words reveal">Mau ajak nostalgia duluuu.
      <small>scroll ke bawah ↓</small></p>
  </section>

  <div id="memories"></div>

  <section>
    <p class="words reveal">Terima kasih sudah jadi bagian dari semua cerita itu. 🥑💖</p>
  </section>

  <section id="finale">
    <canvas id="confetti"></canvas>
    <div class="deco">🥑 💖 🎀 💖 🥑</div>
    <img class="bday" id="bday" alt="Yang ulang tahun">
    <h2 class="hb">Happy<span>Birthday</span></h2>
    <p class="who" id="who"></p>
    <p class="wish">Semogaa bebeb sehat selalu, bahagia, panjang umurrr, bareng2 trus yuk 💖</p>
    <button id="again">Hujan confetti lagi 🎉</button>
  </section>
</main>

/* =============================== */

const wrap = document.getElementById('memories');
MEMORIES.forEach((m,i)=>{
  const s = document.createElement('section');
  s.className = 'memory';
  const photo = m.photo ? `<img src="${m.photo}" alt="${m.date}">` : m.emoji;
  s.innerHTML = `
    <div class="polaroid reveal" style="--tilt:${i%2?3:-3}deg">
      <div class="photo" style="--bg:${m.bg}">${photo}</div>
      <div class="date">${m.date}</div>
      <span class="sticker">${["🥑","🎀","🥑","💖"][i%4]}</span>
    </div>
    <p class="note reveal">${m.text}</p>`;
  wrap.appendChild(s);
});
document.getElementById('bday').src = BDAY;
document.getElementById('who').textContent = 'Untuk ' + NAME + ' 💖';

const fl = document.getElementById('floaty'), em = ['🥑','💖','🌸','🎀','✨','🍓','🥑','🤍'];
for(let i=0;i<16;i++){const s=document.createElement('span');s.textContent=em[i%em.length];s.style.left=(Math.random()*94)+'%';s.style.fontSize=(18+Math.random()*22)+'px';s.style.animationDuration=(14+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';fl.appendChild(s)}

const io = new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');}}),{threshold:.35});
const observe = ()=>document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
observe();

/* confetti */
const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
let bits = [], raf;
const colors = ['#e8467f','#ff8fb8','#fff3a8','#c9f2e0','#ffffff','#d9c8ff'];
function size(){cv.width = cv.offsetWidth; cv.height = cv.offsetHeight}
function burst(){
  size();
  for(let i=0;i<140;i++) bits.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:6+Math.random()*6,h:10+Math.random()*8,vy:2+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*6,vr:-.2+Math.random()*.4,c:colors[i%colors.length]});
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.restore()});
  bits = bits.filter(b=>b.y<cv.height+30);
  raf = bits.length ? requestAnimationFrame(loop) : (ctx.clearRect(0,0,cv.width,cv.height),null);
}
let fired = false;
new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting && !fired){fired=true;burst()}}),{threshold:.5}).observe(document.getElementById('finale'));
document.getElementById('again').onclick = burst;

document.getElementById('open').onclick = ()=>{
  document.getElementById('intro').classList.add('gone');
  document.body.classList.remove('locked');
};
</script>
